name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the GitHub release
  packages: write  # push images to ghcr.io
  id-token: write  # NuGet trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build, test, pack and zip
        run: ./build.sh Test Pack Zip DockerBuild ReleaseNotes

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push NuGet packages and Docker images
        run: ./build.sh NuGetPush DockerPush --skip Restore Compile Test Pack DockerBuild --nuget-api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" artifacts/zip/*.zip artifacts/packages/*.nupkg \
            --title "$TAG" --notes-file artifacts/release-notes.md "${args[@]}"
