site_name: MessageQueue.NET
site_description: A lightweight message queue REST API for .NET
site_url: https://docs.gviewonline.com/other/messagequeue-net/
docs_dir: docs
site_dir: artifacts/docs/site
repo_url: https://github.com/jugstalt/MessageQueueNET
repo_name: jugstalt/MessageQueueNET
edit_uri: ""

# relative links and file names: the site is hosted below docs.gviewonline.com/other/messagequeue-net/
use_directory_urls: false

theme:
  name: material
  # no Google Fonts: keep the site self-contained
  font: false
  icon:
    logo: material/tray-full
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Start
            Installation: Installation
            Web API: Web-API
            Configuration: Konfiguration
            REST reference: REST-Referenz
            Client library: Client-Bibliothek
            Command line tools: Kommandozeilen-Tools
            Patterns: Patterns
            Queue worker: Queue Worker
            App topic: App Topic
            Build & release: Build & Release
            Changelog: Changelog

exclude_docs: |
  requirements.txt
  *.excalidraw

extra_css:
  - assets/extra.css

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Installation: installation.md
  - Web API:
      - Configuration: api/configuration.md
      - REST reference: api/rest.md
  - Client library: client.md
  - Command line tools: tools.md
  - Patterns:
      - Queue worker: patterns/queue-worker.md
      - App topic: patterns/app-topic.md
  - Build & release: release.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
