# Runs MessageQueueNET API (http://localhost:9091) and dashboard (http://localhost:9090).
#
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# Set MQ_TAG to use a specific version (default: latest).

services:
  messagequeue:
    image: ghcr.io/jugstalt/messagequeue-net:${MQ_TAG:-latest}
    container_name: messagequeue-net
    ports:
      - "9091:8080"
    environment:
      MESSAGEQUEUE__PERSIST__TYPE: filesystem
      MESSAGEQUEUE__PERSIST__ROOTPATH: /home/app/messagequeue/persist
      OPENAPIUI: "true"
    volumes:
      - messagequeue-data:/home/app/messagequeue
    restart: unless-stopped

  dashboard:
    image: ghcr.io/jugstalt/messagequeue-net-dashboard:${MQ_TAG:-latest}
    container_name: messagequeue-net-dashboard
    ports:
      - "9090:8080"
    environment:
      DASHBOARD__QUEUES__0__NAME: dev
      DASHBOARD__QUEUES__0__URL: http://messagequeue:8080
    depends_on:
      - messagequeue
    restart: unless-stopped

volumes:
  messagequeue-data:
